[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hs1-weights"
version = "0.1.0"
description = "HS1 aircraft weight-prediction module: physics-based component models calibrated on GA fleet data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "pydantic>=2.5"]

[project.optional-dependencies]
bayes = ["numpyro>=0.15", "jax>=0.4", "arviz>=0.17"]
gp = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
